[project]
name = "undiscord-cli"
version = "0.1.0"
description = "Bulk delete Discord messages from channels and DMs"
readme = "README.MD"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28",
    "pydantic-settings>=2.7",
    "rich>=13.9",
    "typer>=0.15",
]

[project.scripts]
undiscord = "undiscord_cli.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["undiscord_cli"]
